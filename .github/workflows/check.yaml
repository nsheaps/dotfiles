name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          ref: ${{ github.head_ref || github.ref }}

      - name: Install shfmt
        run: |
          # ubuntu-latest ships shellcheck but not shfmt; install a pinned
          # release so the `shfmt check` step has the binary on PATH.
          SHFMT_VERSION=v3.10.0
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/shfmt" \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          chmod +x "$HOME/.local/bin/shfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shfmt" --version

      - name: Find bash scripts
        id: find-bash
        run: |
          # Collect .sh files with bash shebangs + standalone bash scripts in bin/
          bash_files=""
          for f in $(find . -name '*.sh' -not -path './.git/*' -not -path './.dev/*'); do
            shebang=$(head -1 "$f")
            if echo "$shebang" | grep -qE '(bash|^#!/bin/sh)'; then
              bash_files="$bash_files $f"
            fi
          done
          # Also check bin/ scripts without .sh extension
          for f in $(find ./bin -maxdepth 1 -type f -not -name '*.sh' -not -path './.git/*'); do
            shebang=$(head -1 "$f")
            if echo "$shebang" | grep -qE '(bash|^#!/bin/sh)'; then
              bash_files="$bash_files $f"
            fi
          done
          # Also check _home/.local/bin/ scripts without .sh extension (the
          # ones `ensure_local_bin` actually links onto PATH — e.g. gh-user)
          for f in $(find ./_home/.local/bin -maxdepth 1 -type f -not -name '*.sh' -not -path './.git/*'); do
            shebang=$(head -1 "$f")
            if echo "$shebang" | grep -qE '(bash|^#!/bin/sh)'; then
              bash_files="$bash_files $f"
            fi
          done
          # Also check internal/ shell config files (bashrc, bash_profile)
          for f in ./internal/bashrc ./internal/bash_profile; do
            if [[ -f "$f" ]]; then
              shebang=$(head -1 "$f")
              if echo "$shebang" | grep -qE '(bash|^#!/bin/sh)'; then
                bash_files="$bash_files $f"
              fi
            fi
          done
          echo "files=$bash_files" >> "$GITHUB_OUTPUT"
          echo "Found bash files:$bash_files"

      # Autofix runs first and is tolerant of failure (e.g. a file shfmt can't
      # parse) so a fix it DID manage to make still gets committed and pushed;
      # the failure itself is surfaced by the final step below instead of
      # aborting the job here.
      - name: shfmt -w (autofix)
        id: shfmt
        if: steps.find-bash.outputs.files != ''
        continue-on-error: true
        run: |
          bash_files="${{ steps.find-bash.outputs.files }}"
          echo "Running shfmt on:$bash_files"
          # -w writes formatting fixes in place; indent settings sourced from .editorconfig
          shfmt -w $bash_files

      - name: Commit and push shfmt fixes
        if: steps.find-bash.outputs.files != '' && !cancelled()
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: 'chore: `shfmt -w`'
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}

      # Check-only steps below can't auto-fix their own findings; they run
      # with continue-on-error so a failure here never skips the autofix
      # steps above (or each other) — the final step re-raises failure.
      - name: ShellCheck
        id: shellcheck
        if: steps.find-bash.outputs.files != ''
        continue-on-error: true
        run: |
          bash_files="${{ steps.find-bash.outputs.files }}"
          echo "Running ShellCheck on:$bash_files"
          shellcheck $bash_files

      - name: EditorConfig check
        id: editorconfig
        continue-on-error: true
        uses: editorconfig-checker/action-editorconfig-checker@main

      - name: Run editorconfig-checker
        id: editorconfig-run
        continue-on-error: true
        run: editorconfig-checker

      - name: Fail if any check failed
        if: steps.shfmt.outcome == 'failure' || steps.shellcheck.outcome == 'failure' || steps.editorconfig.outcome == 'failure' || steps.editorconfig-run.outcome == 'failure'
        run: |
          echo "One or more checks failed. Any autofixes were already committed and pushed above."
          exit 1
